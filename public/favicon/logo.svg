<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- tashqi segmentli halqa (to'q ko'k) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#1f6cb2" stroke-width="8"
          stroke-dasharray="52 14" stroke-dashoffset="7" transform="rotate(-12 50 50)"/>
  <!-- o'rta segmentli halqa (ko'k) -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#3f97d2" stroke-width="6.5"
          stroke-dasharray="40 12" stroke-dashoffset="20" transform="rotate(34 50 50)"/>
  <!-- ichki segmentli halqa (och ko'k) -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#86cbec" stroke-width="5"
          stroke-dasharray="30 9" transform="rotate(-8 50 50)"/>
  <!-- markazdagi IT -->
  <text x="50" y="51" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="30" fill="#1a1b5e" letter-spacing="0.5">IT</text>
</svg>
